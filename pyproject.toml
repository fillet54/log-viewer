[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinc"
version = "0.1.0"
description = "HTML log viewer"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "jinja2",
    "waitress",
    "docopt",
]

[project.optional-dependencies]
dev = ["pytest", "flake8", "black"]

[project.scripts]
cinc = "cinc.__main__:main"

[project.entry-points."cinc.log_types"]
core-event = "cinc.plugins.core_event:CoreEventLogType"
text-log = "cinc.plugins.text_log:TextLogType"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["cinc*"]

[tool.setuptools.package-data]
cinc = [
    "templates/**/*.html",
    "static/**/*.js",
    "static/**/*.css",
    "static/**/*.html",
    "plugins/**/*.json",
    "samples/**/*.json",
    "plugins/**/*.html",
    "plugins/**/*.js",
    "plugins/**/*.css",
    "static/vendor/MANIFEST.json",
]
