[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinc"
version = "0.1.0"
description = "HTML log viewer"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "waitress",
    "docopt",
    "docutils",
]

[project.scripts]
cinc = "cinc.__main__:main"

[project.entry-points."cinc.plugins"]
core-event = "cinc.plugins:CoreEventPlugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["cinc*"]

[tool.setuptools.package-data]
cinc = [
    "templates/**/*.html",
    "static/**/*.js",
    "static/**/*.css",
    "static/**/*.html",
    "plugins/**/*.json",
    "plugins/**/*.html",
    "plugins/**/*.js",
]
