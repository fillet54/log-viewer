<template data-role="row-template">
  <div class="log-line">
    <span class="log-channels">
      <span class="log-channel" data-channel="A">A</span>
      <span class="log-channel" data-channel="B">B</span>
      <span class="log-channel" data-channel="C">C</span>
      <span class="log-channel" data-channel="D">D</span>
    </span>
    <span class="log-time log-muted" data-field="utctime"></span>
    <span class="log-offset log-muted" data-field="offset"></span>
    <span class="log-action" data-field="action">
      <span class="log-action-label" data-field="action-label"></span>
      <span class="log-match" data-field="match-links"></span>
    </span>
    <span class="log-details">
      <span class="log-title-row">
        <span class="log-name" data-field="name"></span>
        <span class="log-prefix" data-field="fault-prefix"></span>
        <span class="log-meta" data-field="location"></span>
      </span>
      <span class="log-desc" data-field="description"></span>
    </span>
    <span class="data-indicator" data-field="data-indicator" title="No event data" aria-label="No event data">
      <svg class="data-icon data-icon-empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7.5C4 5.567 7.582 4 12 4s8 1.567 8 3.5S16.418 11 12 11 4 9.433 4 7.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7.5v4C4 13.433 7.582 15 12 15s8-1.567 8-3.5v-4" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 11.5v4C4 17.433 7.582 19 12 19s8-1.567 8-3.5v-4" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6" />
      </svg>
      <svg class="data-icon data-icon-present" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7.5C4 5.567 7.582 4 12 4s8 1.567 8 3.5S16.418 11 12 11 4 9.433 4 7.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7.5v4C4 13.433 7.582 15 12 15s8-1.567 8-3.5v-4" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 11.5v4C4 17.433 7.582 19 12 19s8-1.567 8-3.5v-4" />
      </svg>
    </span>
    <button class="bookmark-toggle" title="Toggle bookmark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 4h12v16l-6-3-6 3z" />
      </svg>
    </button>
  </div>
</template>
