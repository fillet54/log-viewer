{% extends "base.html" %}

{% block content %}
  <section class="centered-page">
    <div class="card auth-card auth-card-wide">
      <h1 class="page-title">Profile</h1>
      {% if first_login %}
        <p class="page-subtitle">
          Welcome! Add your name so teammates know who you are.
        </p>
      {% endif %}
      <form method="post" class="form-stack">
        <label class="field">
          <span class="field-label">Email</span>
          <input
            type="email"
            class="text-input"
            value="{{ user.email }}"
            disabled
          />
        </label>
        <label class="field">
          <span class="field-label">Name</span>
          <input
            type="text"
            name="name"
            class="text-input"
            value="{{ user.name or '' }}"
            placeholder="Your name"
            required
          />
        </label>
        <div class="form-actions form-actions-between">
          <a class="button button-ghost button-small" href="{{ url_for('index') }}">Back</a>
          <button class="button button-primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
