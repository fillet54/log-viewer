<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Cinc{% endblock %}</title>
    <script>
      (function () {
        const storageKey = "eventlog2-theme";
        const storedTheme = localStorage.getItem(storageKey);
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme = storedTheme || preferredTheme;
      })();
    </script>
    <script type="importmap">
    {
      "imports": {
        "preact": "/static/vendor/preact.mjs",
        "preact/hooks": "/static/vendor/hooks.mjs",
        "preact/signals": "/static/vendor/signals.mjs",
        "@preact/signals-core": "/static/vendor/signals-core.mjs",
        "htm": "/static/vendor/htm-core.mjs",
        "htm/preact": "/static/vendor/htm-preact.mjs",
        "logview/lib": "/static/logview/lib.js",
        "static/runtime.js": "/static/runtime.js"
      }
    }
    </script>
    <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/split.min.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='runtime.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    {% block head_extra %}{% endblock %}
  </head>
  <body class="app-body{% block body_class %}{% endblock %}">
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a href="{{ url_for('index') }}" class="brand">
            <img src="{{ url_for('static', filename='img/logo_lightmode.png') }}" class="brand-logo brand-logo-light" alt="Cinc" />
            <img src="{{ url_for('static', filename='img/logo_darkmode.png') }}" class="brand-logo brand-logo-dark" alt="Cinc" />
            <span class="brand-name">Cinc</span>
          </a>
          <nav class="topbar-nav" style="display: flex; align-items: center; gap: 0.35rem;">
            <a href="{{ url_for('logs.index') }}" class="button button-ghost button-xs">Logs</a>
            <a href="{{ url_for('live.sessions') }}" class="button button-ghost button-xs">Live</a>
          </nav>
        <div class="topbar-actions">
          <button type="button" id="theme-toggle" class="button button-ghost button-xs" aria-label="Toggle theme">
            Theme
          </button>
        </div>
      </div>
      </header>
      <main class="app-content{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script>
      (function () {
        const storageKey = "eventlog2-theme";
        const button = document.getElementById("theme-toggle");
        if (!button) return;
        const root = document.documentElement;
        const syncLabel = () => {
          const theme = root.dataset.theme === "dark" ? "Dark" : "Light";
          button.textContent = theme;
          button.setAttribute("aria-label", `Switch theme. Current theme: ${theme}`);
        };
        button.addEventListener("click", () => {
          root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
          localStorage.setItem(storageKey, root.dataset.theme);
          syncLabel();
        });
        syncLabel();
      })();
    </script>
    {% block body_scripts %}{% endblock %}
  </body>
</html>
