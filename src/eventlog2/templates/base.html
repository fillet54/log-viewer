<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}HTML Log Viewer{% endblock %}</title>
    <script>
      (function () {
        const storageKey = "eventlog2-theme";
        const storedTheme = localStorage.getItem(storageKey);
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme = storedTheme || preferredTheme;
      })();
    </script>
    <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/split.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/preact.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/preact-hooks.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/htm.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/preact-signals-core.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/preact-signals.min.js') }}"></script>
    <script src="{{ url_for('static', filename='preact/runtime.js') }}"></script>
    <script src="{{ url_for('static', filename='preact/context.js') }}"></script>
    <script src="{{ url_for('static', filename='preact/hooks/use-app-services.js') }}"></script>
    <script src="{{ url_for('static', filename='preact/hooks/use-bus.js') }}"></script>
    <script src="{{ url_for('static', filename='preact/hooks/use-local-storage.js') }}"></script>
    <script src="{{ url_for('static', filename='preact/hooks/use-split.js') }}"></script>
    <script src="{{ url_for('static', filename='preact/hooks/use-virtual-list.js') }}"></script>
    <script src="{{ url_for('static', filename='preact/mount.js') }}"></script>
    <script src="{{ url_for('static', filename='preact/components/detail-panel.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    {% block head_extra %}{% endblock %}
  </head>
  <body class="app-body{% block body_class %}{% endblock %}">
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a href="{{ url_for('index') }}" class="brand">HTML Log Viewer</a>
        <div class="topbar-actions">
          <button type="button" id="theme-toggle" class="button button-ghost button-xs" aria-label="Toggle theme">
            Theme
          </button>
          <span class="user-state">Development Page</span>
        </div>
      </div>
      </header>
      <main class="app-content{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script>
      (function () {
        const storageKey = "eventlog2-theme";
        const button = document.getElementById("theme-toggle");
        if (!button) return;
        const root = document.documentElement;
        const syncLabel = () => {
          const theme = root.dataset.theme === "dark" ? "Dark" : "Light";
          button.textContent = theme;
          button.setAttribute("aria-label", `Switch theme. Current theme: ${theme}`);
        };
        button.addEventListener("click", () => {
          root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
          localStorage.setItem(storageKey, root.dataset.theme);
          syncLabel();
        });
        syncLabel();
      })();
    </script>
    {% block body_scripts %}{% endblock %}
  </body>
</html>
