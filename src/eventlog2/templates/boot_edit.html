{% extends "base.html" %}

{% block content %}
  <section class="page-shell page-shell-small">
    <div class="card section-card">
      <div>
        <h1 class="page-title">Edit Boot</h1>
        <p class="page-subtitle">Update system, event ID, or tags for this boot.</p>
      </div>
      <form method="post" class="form-stack">
        <div class="field-grid field-grid-two">
          <label class="field">
            <span class="field-label">System</span>
            <input class="text-input" name="system" value="{{ system or '' }}" placeholder="System" />
          </label>
          <label class="field">
            <span class="field-label">Event Name</span>
            <input class="text-input" name="event_id" value="{{ event_id or '' }}" placeholder="Event name" />
          </label>
        </div>
        <label class="field">
          <span class="field-label">Mode</span>
          <select class="select-input" name="mode">
            <option value="production" {% if mode == "production" %}selected{% endif %}>Production</option>
            <option value="test" {% if mode == "test" %}selected{% endif %}>Test</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Tags (comma separated)</span>
          <input class="text-input" name="tags" value="{{ tags or '' }}" placeholder="tag1, tag2" />
        </label>
        <div class="form-actions">
          <a class="button button-ghost" href="{{ url_for('logs_index') }}">Cancel</a>
          <button type="submit" class="button button-primary">Save</button>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
