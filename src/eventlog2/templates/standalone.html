<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} — Cinc</title>
    <script>
      (function () {
        const storageKey = "eventlog2-theme";
        const storedTheme = localStorage.getItem(storageKey);
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme = storedTheme || preferredTheme;
      })();
    </script>
    <style>
{{ styles|safe }}
    </style>
  </head>
  <body class="app-body app-body-viewer app-body-standalone">
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <span class="brand">
            <img src="{{ logo_light }}" class="brand-logo brand-logo-light" alt="Cinc" />
            <img src="{{ logo_dark }}" class="brand-logo brand-logo-dark" alt="Cinc" />
            <span class="brand-name">Cinc</span>
          </span>
          <div class="topbar-actions">
            <button type="button" id="theme-toggle" class="button button-ghost button-xs" aria-label="Toggle theme">
              Theme
            </button>
            <span class="user-state">Standalone Page</span>
          </div>
        </div>
      </header>
      <main class="app-content app-content-viewer">
        <div class="viewer-page">
          <div id="log-viewer-root" class="log-viewer-root"></div>
        </div>
      </main>
    </div>
    <script>
      (function () {
        const storageKey = "eventlog2-theme";
        const button = document.getElementById("theme-toggle");
        if (!button) return;
        const root = document.documentElement;
        const syncLabel = () => {
          const theme = root.dataset.theme === "dark" ? "Dark" : "Light";
          button.textContent = theme;
          button.setAttribute("aria-label", `Switch theme. Current theme: ${theme}`);
        };
        button.addEventListener("click", () => {
          root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
          localStorage.setItem(storageKey, root.dataset.theme);
          syncLabel();
        });
        syncLabel();
      })();
    </script>
    {% for script in global_scripts %}
    <script>
{{ script|replace('</script', '<\\/script')|safe }}
    </script>
    {% endfor %}

    <script id="esm-data" type="application/json">
{{ esm_data|safe }}
    </script>
    <script>
      (function() {
        const dataNode = document.getElementById('esm-data');
        if (!dataNode) return;
        const data = JSON.parse(dataNode.textContent);
        const imports = {};
        for (const [id, code] of Object.entries(data)) {
          const blob = new Blob([code], { type: 'text/javascript' });
          const url = URL.createObjectURL(blob);
          imports[id] = url;
        }
        const script = document.createElement('script');
        script.type = 'importmap';
        script.textContent = JSON.stringify({ imports });
        document.head.appendChild(script);
      })();
    </script>

    {% if entry_point_id %}
    <script type="module">
      import "static/runtime.js";
      import "{{ entry_point_id }}";
    </script>
    {% endif %}
  </body>
</html>
