{% extends "base.html" %}

{% block content %}
  <section class="centered-page">
    <div class="card auth-card">
      <h1 class="page-title">Sign in</h1>
      <p class="page-subtitle">
        Enter your email to receive a one-time link. For development you'll be sent directly to the link.
      </p>
      <form method="post" class="form-stack">
        <label class="field">
          <span class="field-label">Email</span>
          <input
            type="email"
            name="email"
            required
            class="text-input"
            placeholder="you@example.com"
          />
        </label>
        <button class="button button-primary button-full" type="submit">Send magic link</button>
      </form>
    </div>
  </section>
{% endblock %}
