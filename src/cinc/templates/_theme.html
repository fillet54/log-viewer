{#- Theme: the reader's stored choice, else the system's. Shared by the app and standalone pages. -#}
{% macro head_script() -%}
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem("cinc-theme"); } catch (e) {}
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = stored || (dark ? "dark" : "light");
  })();
</script>
{%- endmacro %}
{% macro toggle_script() -%}
<script>
  (function () {
    var button = document.getElementById("theme-toggle");
    if (!button) return;
    var root = document.documentElement;
    var sync = function () {
      var theme = root.dataset.theme === "dark" ? "Dark" : "Light";
      button.textContent = theme;
      button.setAttribute("aria-label", "Switch theme. Current theme: " + theme);
    };
    button.addEventListener("click", function () {
      root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
      try { localStorage.setItem("cinc-theme", root.dataset.theme); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
{%- endmacro %}
