{% extends "base.html" %}
{% block content %}
<main class="live-page">
  <h1>Live captures</h1>
  {% for log_type in registry.all() %}
  <section class="log-type-card">
    <h2>{{ log_type.name }}</h2>
    {% if live.get(log_type.id) %}
    <form method="post" action="{{ url_for('live.start', log_type_id=log_type.id) }}">
      <button type="submit">Start capture</button>
    </form>
    {% else %}<p>Live capture unavailable.</p>{% endif %}
  </section>
  {% endfor %}
</main>
{% endblock %}
